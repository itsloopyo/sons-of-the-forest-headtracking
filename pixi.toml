[workspace]
name = "sons-of-the-forest-head-tracking"
version = "0.1.0"
description = "Head tracking mod for Sons of the Forest using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
restore = "dotnet restore src/SonsOfTheForestHeadTracking/SonsOfTheForestHeadTracking.csproj"
setup = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1", depends-on = ["restore"] }
build = { cmd = "dotnet build src/SonsOfTheForestHeadTracking/SonsOfTheForestHeadTracking.csproj -c Release", depends-on = ["setup"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test-unit"] }
uninstall = "scripts\\uninstall.cmd"
# The repo checks, then the config tests, among them the differential test in
# tests/config_differential, which holds the legacy import to the published build's own reader on
# its first-run file and on core's mutation corpus, then core's canonical config lint over the
# committed file and every file the test migrated. What the mod does to the camera is checked by an
# in-game pass.
test-unit = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/validate-repo.ps1 && dotnet test tests/SonsOfTheForestHeadTracking.Tests/SonsOfTheForestHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName!~Differential", depends-on = ["build"] }
test-differential = { cmd = "dotnet test tests/SonsOfTheForestHeadTracking.Tests/SonsOfTheForestHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~Differential && node tests/config_differential/lint-migrated.mjs tests/SonsOfTheForestHeadTracking.Tests/bin/Release/net8.0/migrated", depends-on = ["build"] }
test = { depends-on = ["test-unit", "test-differential"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/SonsOfTheForestHeadTracking.Tests/SonsOfTheForestHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" }, depends-on = ["build"] }
# Reads the newest ZIP in release/ and checks every source a manifest entry names is really in it,
# and the config descriptor. No depends-on: it runs after packaging.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
clean = "dotnet clean src/SonsOfTheForestHeadTracking/SonsOfTheForestHeadTracking.csproj"

# Bump vendored mod-loader copies to latest upstream. Manual; commit the result.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

[dependencies]
# Node runs the canonical config lint in `test-differential`, and
# validate-manifest. Pinned to the release cameraunlock-core's own lock resolves.
nodejs = "==26.5.0"
